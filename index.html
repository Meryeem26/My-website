<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f0ff;
            color: #333366;
            padding: 60px 20px;
        }
        h1 {
            color: #7655d9;
        }
        button {
            background-color: #7655d9;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #6040bd;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>Welcome to my first website!</p>
    <button onclick="alert('You clicked the button!')">Click Me</button>
</body>
</html>
